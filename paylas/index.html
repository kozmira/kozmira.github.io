<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kozmira · Paylaşım masası</title>
<!--
  Ekip için: günün videosunun TikTok ve YouTube metinleri tek dokunuşla kopyalanır (TikTok video taslağına açıklama
  API ile eklenemiyor). Veri: media dalındaki plan.json (npm run studyo -- yayinla yükler). Arama motorlarına kapalı.
-->
<style>
  :root { --bg: #0B0A1F; --card: #17153A; --line: #2E2A63; --text: #F2EFFF; --muted: #B9B4DA; --faint: #8E89B8; --gold: #E8C872; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font: 400 30px/1.15 Georgia, serif; margin: 0 0 4px; }
  .sub { color: var(--faint); margin: 0 0 24px; font-size: 14px; }
  h2 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 28px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .head { display: flex; gap: 14px; align-items: center; }
  .head img { width: 64px; height: 114px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .kind { font-weight: 700; }
  .date { color: var(--faint); font-size: 14px; }
  .field { margin-top: 14px; }
  .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; padding: 12px; background: rgba(11, 10, 31, .6); border: 1px solid var(--line); border-radius: 12px; font: 14px/1.5 system-ui, sans-serif; color: var(--muted); max-height: 180px; overflow: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button, a.btn { appearance: none; border: 1px solid var(--line); background: rgba(232, 200, 114, .1); color: var(--gold); border-radius: 999px; padding: 9px 16px;
                  font: 600 14px system-ui, sans-serif; cursor: pointer; text-decoration: none; }
  button.ok { background: var(--gold); color: #1A1440; }
  .empty { color: var(--faint); }
</style>
</head>
<body>
<main>
  <h1>Paylaşım masası</h1>
  <p class="sub">Günün videosu ve metinleri. TikTok taslağını açınca açıklamayı buradan kopyala.</p>
  <h2>Bugün</h2>
  <div id="today"><p class="empty">Yükleniyor…</p></div>
  <h2>Önümüzdeki videolar</h2>
  <div id="next"></div>
</main>
<script>
const PLAN = 'https://raw.githubusercontent.com/kozmira/kozmira.github.io/media/plan.json';
// scripts/sosyal/tiktok.mjs ile aynı: Instagram etiketleri yerine TikTok etiketleri
const TT_TAGS = '#astroloji #burçlar #astrolojitiktok #burcyorumlari #kozmira';
const tiktokText = (caption) => caption.split('\n').filter((l) => !l.trim().startsWith('#')).join('\n').trim() + '\n\n' + TT_TAGS;
const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Istanbul' }).format(new Date());
const nice = (d) => new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' }).format(new Date(d + 'T12:00:00'));
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const texts = [];
function field(label, text) {
  const i = texts.push(text) - 1;
  return `<div class="field"><div class="label">${label}</div><pre>${esc(text)}</pre><div class="row"><button data-i="${i}">Kopyala</button></div></div>`;
}
function card(e, full) {
  const r = e.reel;
  return `<div class="card"><div class="head"><img src="${r.cover}" alt=""><div><div class="kind">${esc(r.kind)}</div><div class="date">${nice(e.date)}</div>
    <div class="row"><a class="btn" href="${r.video}" download>Videoyu indir</a></div></div></div>
    ${full ? field('TikTok açıklaması', tiktokText(r.caption)) + field('YouTube başlığı', r.youtube.title) + field('YouTube açıklaması', r.youtube.description)
      : field('TikTok açıklaması', tiktokText(r.caption)) + field('YouTube başlığı', r.youtube.title)}
  </div>`;
}
document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-i]');
  if (!b) return;
  try { await navigator.clipboard.writeText(texts[+b.dataset.i]); b.textContent = 'Kopyalandı ✓'; b.classList.add('ok'); }
  catch { b.textContent = 'Kopyalanamadı: metni basılı tutup seç'; }
  setTimeout(() => { b.textContent = 'Kopyala'; b.classList.remove('ok'); }, 2000);
});
fetch(PLAN, { cache: 'no-store' }).then((r) => r.json()).then((plan) => {
  const t = plan.find((e) => e.date === today);
  document.getElementById('today').innerHTML = t?.reel ? card(t, true) : '<p class="empty">Bugün video yok.</p>';
  const next = plan.filter((e) => e.date > today && e.reel).slice(0, 8);
  document.getElementById('next').innerHTML = next.length ? next.map((e) => card(e, true)).join('') : '<p class="empty">Planda yeni video yok.</p>';
}).catch(() => { document.getElementById('today').innerHTML = '<p class="empty">Plan yüklenemedi; biraz sonra yeniden dene.</p>'; });
</script>
</body>
</html>
