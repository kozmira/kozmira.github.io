<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Riduna · TikTok bağlantısı</title>
<style>
  :root { --bg: #0B0A1F; --card: #17153A; --line: #2E2A63; --text: #F2EFFF; --muted: #B9B4DA; --gold: #E8C872; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.65 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  header .logo { width: 48px; height: 48px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 24px; }
  header span { color: var(--gold); font-weight: 700; letter-spacing: .04em; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 6px; }
  .date { color: var(--muted); margin: 0 0 28px; }
  h2 { font-size: 20px; color: var(--gold); margin: 36px 0 8px; }
  p, li { color: var(--muted); }
  strong { color: var(--text); }
  .highlight { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; color: var(--text); }
  ul { padding-left: 22px; }
  a { color: var(--gold); }
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header><div class="logo">🌙</div><span>RIDUNA</span></header>
  <h1>TikTok bağlantısı</h1>
  <p id="msg">Bu sayfa, Riduna'nın TikTok hesabına bağlanması için kullanılır.</p>
  <p class="highlight" id="box" style="display:none;word-break:break-all"></p>
  <footer>© 2026 Riduna</footer>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), err = q.get('error');
  const box = document.getElementById('box'), msg = document.getElementById('msg');
  if (code) { msg.textContent = 'İzin verildi. Bu kodu Claude ile paylaştığın sohbete yapıştır (birkaç dakika içinde geçersiz olur):'; box.style.display = 'block'; box.textContent = code; }
  else if (err) { msg.textContent = 'İzin verilmedi: ' + (q.get('error_description') || err); }
</script>
</body>
</html>
